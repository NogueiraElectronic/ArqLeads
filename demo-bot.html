<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArqLeads - Estudio de Arquitectura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>

    <script type="text/babel" data-type="module">
        const { useState, useRef, useEffect } = React;

        // Iconos SVG
        const MessageCircleIcon = () => (
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        );

        const XIcon = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        const SendIcon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        );

        const LoaderIcon = () => (
            <svg className="animate-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg>
        );

        // ChatWidget Component
        function ChatWidget() {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([
                {
                    role: 'assistant',
                    content: '¡Hola! 👋 Soy el asistente virtual de tu estudio de arquitectura. ¿En qué proyecto estás pensando?',
                    timestamp: new Date().toISOString()
                }
            ]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [sessionId] = useState(() => `session-${Date.now()}`);
            const [leadScore, setLeadScore] = useState(0);
            const [leadCategory, setLeadCategory] = useState('cold');
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const getCategoryColor = (category) => {
                switch(category) {
                    case 'hot': return 'text-red-600';
                    case 'warm': return 'text-orange-600';
                    default: return 'text-blue-600';
                }
            };

            const getCategoryLabel = (category) => {
                switch(category) {
                    case 'hot': return '🔥 Lead Caliente';
                    case 'warm': return '⚡ Lead Tibio';
                    default: return '❄️ Lead Frío';
                }
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isLoading) return;

                const userMessage = {
                    role: 'user',
                    content: input.trim(),
                    timestamp: new Date().toISOString()
                };

                setMessages(prev => [...prev, userMessage]);
                setInput('');
                setIsLoading(true);

                try {
                    // Simulación de respuesta (ya que el backend no está disponible)
                    await new Promise(resolve => setTimeout(resolve, 1000));

                    const assistantMessage = {
                        role: 'assistant',
                        content: '⚠️ Backend no disponible. Para conectar con el API real, necesitas levantar el backend con Docker.\n\nEste es un demo de la interfaz. El bot real analizaría tu mensaje y te daría información sobre servicios de arquitectura, presupuestos y más.',
                        timestamp: new Date().toISOString()
                    };

                    setMessages(prev => [...prev, assistantMessage]);
                    setLeadScore(prev => Math.min(prev + 10, 100));

                    if (leadScore > 60) setLeadCategory('hot');
                    else if (leadScore > 30) setLeadCategory('warm');

                } catch (error) {
                    console.error('Error:', error);
                    const errorMessage = {
                        role: 'assistant',
                        content: 'Lo siento, hubo un error. Por favor, intenta de nuevo.',
                        timestamp: new Date().toISOString()
                    };
                    setMessages(prev => [...prev, errorMessage]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <>
                    {/* Chat Button */}
                    {!isOpen && (
                        <button
                            onClick={() => setIsOpen(true)}
                            className="fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white rounded-full p-4 shadow-lg transition-all hover:scale-110 z-50"
                        >
                            <MessageCircleIcon />
                        </button>
                    )}

                    {/* Chat Window */}
                    {isOpen && (
                        <div className="fixed bottom-6 right-6 w-96 h-[600px] bg-white rounded-lg shadow-2xl flex flex-col z-50 border border-gray-200">
                            {/* Header */}
                            <div className="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-4 rounded-t-lg flex justify-between items-center">
                                <div>
                                    <h3 className="font-bold text-lg">ArqLeads Assistant</h3>
                                    <p className="text-xs opacity-90">Estudio de Arquitectura</p>
                                </div>
                                <button
                                    onClick={() => setIsOpen(false)}
                                    className="hover:bg-blue-800 rounded-full p-1 transition"
                                >
                                    <XIcon />
                                </button>
                            </div>

                            {/* Lead Score Indicator */}
                            <div className="bg-gray-50 px-4 py-2 border-b border-gray-200 flex justify-between items-center text-sm">
                                <span className="text-gray-600">Puntuación: <strong>{leadScore}</strong></span>
                                <span className={`font-semibold ${getCategoryColor(leadCategory)}`}>
                                    {getCategoryLabel(leadCategory)}
                                </span>
                            </div>

                            {/* Messages */}
                            <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
                                {messages.map((msg, idx) => (
                                    <div
                                        key={idx}
                                        className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                                    >
                                        <div
                                            className={`max-w-[80%] rounded-lg p-3 ${
                                                msg.role === 'user'
                                                    ? 'bg-blue-600 text-white rounded-br-none'
                                                    : 'bg-white text-gray-800 shadow-sm rounded-bl-none border border-gray-200'
                                            }`}
                                        >
                                            <p className="text-sm whitespace-pre-wrap">{msg.content}</p>
                                            <span className={`text-xs mt-1 block ${
                                                msg.role === 'user' ? 'text-blue-100' : 'text-gray-400'
                                            }`}>
                                                {new Date(msg.timestamp).toLocaleTimeString('es-ES', {
                                                    hour: '2-digit',
                                                    minute: '2-digit'
                                                })}
                                            </span>
                                        </div>
                                    </div>
                                ))}

                                {isLoading && (
                                    <div className="flex justify-start">
                                        <div className="bg-white rounded-lg p-3 shadow-sm border border-gray-200">
                                            <LoaderIcon />
                                        </div>
                                    </div>
                                )}

                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input */}
                            <form onSubmit={sendMessage} className="p-4 border-t border-gray-200 bg-white rounded-b-lg">
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        placeholder="Escribe tu mensaje..."
                                        className="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        disabled={isLoading}
                                    />
                                    <button
                                        type="submit"
                                        disabled={isLoading || !input.trim()}
                                        className="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white rounded-lg px-4 py-2 transition-colors"
                                    >
                                        <SendIcon />
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}
                </>
            );
        }

        // Main App Component
        function App() {
            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
                    {/* Hero Section */}
                    <div className="container mx-auto px-4 py-16">
                        <div className="max-w-4xl mx-auto text-center">
                            <h1 className="text-5xl font-bold text-gray-900 mb-6">
                                Estudio de Arquitectura
                                <span className="block text-blue-600 mt-2">Tu Visión, Nuestro Diseño</span>
                            </h1>
                            <p className="text-xl text-gray-700 mb-8">
                                Transformamos tus ideas en espacios únicos. Especialistas en viviendas unifamiliares y reformas integrales.
                            </p>

                            <div className="bg-white rounded-lg shadow-xl p-8 mb-12">
                                <h2 className="text-2xl font-semibold text-gray-800 mb-4">
                                    ¿Tienes un proyecto en mente?
                                </h2>
                                <p className="text-gray-600 mb-6">
                                    Habla con nuestro asistente virtual y cuéntanos tu idea.
                                    Te ayudaremos a dar el primer paso.
                                </p>
                                <div className="flex justify-center gap-8 text-left">
                                    <div className="flex-1 max-w-xs">
                                        <div className="bg-blue-50 rounded-lg p-4">
                                            <h3 className="font-semibold text-blue-900 mb-2">✨ Asesoramiento Inicial</h3>
                                            <p className="text-sm text-blue-800">
                                                Respuestas rápidas sobre tu proyecto
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex-1 max-w-xs">
                                        <div className="bg-indigo-50 rounded-lg p-4">
                                            <h3 className="font-semibold text-indigo-900 mb-2">📋 Sin Compromiso</h3>
                                            <p className="text-sm text-indigo-800">
                                                Información sin obligación de contratar
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex-1 max-w-xs">
                                        <div className="bg-purple-50 rounded-lg p-4">
                                            <h3 className="font-semibold text-purple-900 mb-2">⚡ Respuesta Inmediata</h3>
                                            <p className="text-sm text-purple-800">
                                                Contacto directo con un arquitecto
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Services */}
                            <div className="grid md:grid-cols-3 gap-6 mb-12">
                                <div className="bg-white rounded-lg p-6 shadow-md">
                                    <div className="text-4xl mb-4">🏠</div>
                                    <h3 className="text-xl font-semibold mb-2">Viviendas Unifamiliares</h3>
                                    <p className="text-gray-600">Diseño personalizado de tu casa ideal</p>
                                </div>
                                <div className="bg-white rounded-lg p-6 shadow-md">
                                    <div className="text-4xl mb-4">🔨</div>
                                    <h3 className="text-xl font-semibold mb-2">Reformas Integrales</h3>
                                    <p className="text-gray-600">Renovación completa de espacios</p>
                                </div>
                                <div className="bg-white rounded-lg p-6 shadow-md">
                                    <div className="text-4xl mb-4">📐</div>
                                    <h3 className="text-xl font-semibold mb-2">Proyectos Comerciales</h3>
                                    <p className="text-gray-600">Locales y oficinas a medida</p>
                                </div>
                            </div>

                            {/* CTA */}
                            <div className="bg-blue-600 text-white rounded-lg p-8 shadow-xl">
                                <h2 className="text-3xl font-bold mb-4">¿Listo para empezar?</h2>
                                <p className="text-xl mb-6">
                                    Haz clic en el botón azul de la esquina inferior derecha y cuéntanos tu proyecto 💬
                                </p>
                                <div className="text-sm opacity-90">
                                    <p>📍 Vigo, Galicia</p>
                                    <p>📧 contacto@estudio.com</p>
                                    <p>📞 +34 600 000 000</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Chat Widget */}
                    <ChatWidget />
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
